<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แอปตรวจความปลอดภัย</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap');

:root{
  --navy:#0B1731;
  --navy-2:#132A52;
  --navy-3:#1C3866;
  --amber:#F5B700;
  --amber-2:#D99A00;
  --orange:#E8543E;
  --green:#16A34A;
  --green-bg:#E7F7EC;
  --red:#DC2626;
  --red-bg:#FDEBEB;
  --blue:#2563EB;
  --blue-bg:#EAF1FE;
  --bg:#F1F3F7;
  --card:#FFFFFF;
  --ink:#161E33;
  --mute:#697088;
  --line:#E4E7EF;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Prompt', sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.shell{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 60px rgba(11,23,49,0.15);
}

.hazard-strip{
  height:6px;
  width:100%;
  background:repeating-linear-gradient(135deg,var(--amber) 0 14px, var(--navy) 14px 28px);
  flex:0 0 auto;
}

.topbar{
  background:var(--navy);
  color:#fff;
  padding:18px 18px 22px;
  position:relative;
  flex:0 0 auto;
}
.topbar .row{display:flex; align-items:center; justify-content:space-between;}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand .logo-badge{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(145deg,var(--amber),var(--amber-2));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,0.25);
}
.topbar .brand .logo-badge svg{width:19px; height:19px;}
.topbar h1{font-size:15px; font-weight:700; letter-spacing:0.2px;}
.topbar .sub{font-size:11px; color:#93A2C4; margin-top:1px;}
.icon-btn{
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  display:flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; flex:0 0 auto;
}
.icon-btn svg{width:16px; height:16px;}
.icon-group{display:flex; gap:8px;}
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
.back-row .icon-btn{width:30px;height:30px;}
.page-title{font-size:18px; font-weight:700;}
.page-sub{font-size:12px; color:#93A2C4; margin-top:2px;}

.content{
  flex:1 1 auto;
  overflow-y:auto;
  padding:16px 16px 100px;
}
.content::-webkit-scrollbar{display:none;}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  border:1px solid var(--line);
  margin-bottom:14px;
}
.section-label{
  font-size:11px; font-weight:700; color:var(--mute);
  text-transform:uppercase; letter-spacing:0.8px;
  margin:4px 2px 10px;
  display:flex; align-items:center; gap:6px;
}
.section-label .dash{width:14px; height:2px; background:var(--amber); border-radius:2px;}

.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.kpi{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; position:relative; overflow:hidden;
}
.kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px;}
.kpi.kpi-total::before{background:var(--navy-3);}
.kpi.kpi-open::before{background:var(--amber);}
.kpi.kpi-closed::before{background:var(--green);}
.kpi.kpi-overdue::before{background:var(--red);}
.kpi .num{font-size:24px; font-weight:800; line-height:1.1;}
.kpi .lbl{font-size:11px; color:var(--mute); margin-top:3px; font-weight:500;}

.big-cta{
  background:linear-gradient(135deg,var(--navy),var(--navy-3));
  border-radius:18px; padding:18px; color:#fff; position:relative; overflow:hidden;
  margin-bottom:16px; cursor:pointer; border:none; width:100%; text-align:left;
}
.big-cta::after{
  content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px;
  background:repeating-linear-gradient(135deg, rgba(245,183,0,0.18) 0 10px, transparent 10px 20px);
  border-radius:50%;
}
.big-cta .lab{font-size:12px; color:#9FB0D6; font-weight:500;}
.big-cta .tt{font-size:17px; font-weight:700; margin-top:3px;}
.big-cta .arrow-circle{
  position:absolute; right:16px; bottom:16px; width:36px; height:36px; border-radius:50%;
  background:var(--amber); display:flex; align-items:center; justify-content:center;
}
.big-cta .arrow-circle svg{width:16px;height:16px;}

.donut-row{display:flex; align-items:center; gap:16px;}
.legend{flex:1; display:flex; flex-direction:column; gap:7px;}
.legend .item{display:flex; align-items:center; gap:8px; font-size:12px;}
.legend .sw{width:9px;height:9px;border-radius:3px;}
.legend .pct{margin-left:auto; font-weight:700; color:var(--ink);}

.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.tabs::-webkit-scrollbar{display:none;}
.tab-chip{
  flex:0 0 auto; padding:7px 13px; border-radius:20px; font-size:12px; font-weight:600;
  border:1px solid var(--line); background:#fff; color:var(--mute); cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:6px;
}
.tab-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.tab-chip .cnt{
  background:rgba(0,0,0,0.08); border-radius:10px; padding:1px 6px; font-size:10px;
}
.tab-chip.active .cnt{background:rgba(255,255,255,0.18);}

.task-card{
  background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px; margin-bottom:10px; cursor:pointer;
}
.task-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.task-card .area{font-size:11px; color:var(--mute); font-weight:600;}
.task-card .issue{font-size:14px; font-weight:700; margin-top:2px; line-height:1.3;}
.badge{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;}
.badge.risk-สูง{background:var(--red-bg); color:var(--red);}
.badge.risk-กลาง{background:#FFF4DA; color:var(--amber-2);}
.badge.risk-ต่ำ{background:var(--green-bg); color:var(--green);}
.status-pill{font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px;}
.status-New{background:var(--blue-bg); color:var(--blue);}
.status-Assigned{background:#F1E9FE; color:#7C3AED;}
.status-InProgress{background:#FFF4DA; color:var(--amber-2);}
.status-Waiting{background:#DDF1FB; color:#0891B2;}
.status-Closed{background:var(--green-bg); color:var(--green);}
.task-card .meta{display:flex; align-items:center; gap:12px; margin-top:9px; font-size:11px; color:var(--mute);}
.task-card .meta .m-item{display:flex; align-items:center; gap:4px;}
.task-card .meta svg{width:12px;height:12px;}

.field{margin-bottom:14px;}
.field label{font-size:12px; font-weight:600; color:var(--mute); display:block; margin-bottom:6px;}
.field select, .field input[type=text], .field input[type=date], .field textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1px solid var(--line);
  font-family:'Prompt'; font-size:13.5px; background:#FAFBFD; color:var(--ink);
}
.field textarea{resize:vertical; min-height:56px;}
.field select:focus, .field input:focus, .field textarea:focus{outline:2px solid var(--navy-3); outline-offset:1px;}
.chip-select{display:flex; gap:8px; flex-wrap:wrap;}
.chip-opt{
  padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:600; color:var(--mute); cursor:pointer;
}
.chip-opt.sel-ต่ำ.on{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.chip-opt.sel-กลาง.on{background:#FFF4DA; border-color:var(--amber-2); color:var(--amber-2);}
.chip-opt.sel-สูง.on{background:var(--red-bg); border-color:var(--red); color:var(--red);}

.checklist-item{border:1px solid var(--line); border-radius:13px; padding:12px; margin-bottom:10px; background:#fff;}
.checklist-item .qrow{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.checklist-item .qtext{font-size:13.5px; font-weight:500; line-height:1.4; flex:1;}
.toggle2{display:flex; gap:6px; flex:0 0 auto;}
.toggle2 button{
  border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:9px; font-size:11.5px; font-weight:700;
  color:var(--mute); font-family:'Prompt'; cursor:pointer;
}
.toggle2 button.pass.on{background:var(--green-bg); border-color:var(--green); color:var(--green);}
.toggle2 button.fail.on{background:var(--red-bg); border-color:var(--red); color:var(--red);}
.issue-sub{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.photo-box{
  border:2px dashed var(--line); border-radius:12px; padding:16px; text-align:center; cursor:pointer;
  background:#FAFBFD; color:var(--mute); font-size:12px; font-weight:600;
}
.photo-box.taken{border-style:solid; border-color:var(--green); background:var(--green-bg); color:var(--green);}
.photo-box svg{width:22px;height:22px; margin-bottom:4px;}

.btn-primary{
  width:100%; background:var(--navy); color:#fff; border:none; padding:14px; border-radius:13px;
  font-family:'Prompt'; font-weight:700; font-size:14.5px; cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:8px;
}
.btn-primary:disabled{opacity:0.4;}
.btn-primary svg{width:16px;height:16px;}
.btn-secondary{
  width:100%; background:#fff; color:var(--navy); border:1.5px solid var(--navy); padding:13px; border-radius:13px;
  font-family:'Prompt'; font-weight:700; font-size:14px; cursor:pointer; margin-top:10px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-secondary svg{width:15px;height:15px;}
.btn-sm{
  border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:9px; font-size:12px; font-weight:700;
  font-family:'Prompt'; cursor:pointer; color:var(--navy);
}

.steps{display:flex; gap:6px; margin-bottom:16px;}
.steps .seg{flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,0.15);}
.steps .seg.on{background:var(--amber);}

.toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
  background:var(--navy); color:#fff; padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:8px; opacity:0; pointer-events:none; transition:all .25s;
  max-width:340px; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast svg{width:16px;height:16px; flex:0 0 auto; color:var(--amber);}

.bottomnav{
  position:absolute; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
  display:flex; padding:8px 6px 10px; z-index:20;
}
.nav-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 0;
  color:var(--mute); cursor:pointer; position:relative; border:none; background:none; font-family:'Prompt';
}
.nav-btn svg{width:20px; height:20px;}
.nav-btn span{font-size:10.5px; font-weight:600;}
.nav-btn.active{color:var(--navy);}
.nav-btn .fab{
  width:44px; height:44px; border-radius:50%; background:var(--amber); display:flex; align-items:center;
  justify-content:center; margin-top:-26px; box-shadow:0 4px 12px rgba(245,183,0,0.5); border:4px solid #fff;
}
.nav-btn .fab svg{width:20px;height:20px; color:var(--navy);}
.nav-btn .dot{
  position:absolute; top:0; right:22%; width:15px; height:15px; border-radius:50%; background:var(--red);
  color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
}

.modal-back{position:absolute; inset:0; background:rgba(11,23,49,0.55); z-index:40; display:flex; align-items:flex-end;}
.modal{background:#fff; width:100%; border-radius:22px 22px 0 0; padding:20px 18px 26px; max-height:82%; overflow-y:auto;}
.modal-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
.detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.detail-row .k{color:var(--mute);}
.detail-row .v{font-weight:600; text-align:right;}

.progress-track{display:flex; align-items:center; margin:16px 0 4px;}
.progress-step{flex:1; display:flex; flex-direction:column; align-items:center; position:relative;}
.progress-step .circ{
  width:24px; height:24px; border-radius:50%; background:var(--line); display:flex; align-items:center;
  justify-content:center; font-size:10px; font-weight:700; color:#fff; z-index:2;
}
.progress-step.done .circ{background:var(--green);}
.progress-step.now .circ{background:var(--navy);}
.progress-step .lb{font-size:8.5px; color:var(--mute); margin-top:5px; text-align:center; max-width:52px;}
.progress-line{position:absolute; top:12px; left:-50%; width:100%; height:2px; background:var(--line); z-index:1;}
.progress-step.done .progress-line{background:var(--green);}

.empty{text-align:center; padding:40px 10px; color:var(--mute);}
.empty svg{width:40px;height:40px; margin-bottom:10px; opacity:0.4;}
.empty .t{font-size:13px; font-weight:600;}

/* admin rows */
.admin-row{
  background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;
  display:flex; align-items:center; gap:10px;
}
.admin-row .info{flex:1; min-width:0;}
.admin-row .nm{font-size:13.5px; font-weight:600;}
.admin-row .tg{font-size:11px; color:var(--mute); margin-top:2px;}
.admin-row .acts{display:flex; gap:6px; flex:0 0 auto;}
.icon-sm{
  width:30px; height:30px; border-radius:9px; border:1px solid var(--line); background:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--mute);
}
.icon-sm svg{width:14px;height:14px;}
.icon-sm.danger{color:var(--red); border-color:#F6C6C6;}
.icon-sm.ok{color:var(--green); border-color:#BFE8CE;}
.admin-form{
  background:#FAFBFD; border:1.5px solid var(--navy-3); border-radius:13px; padding:13px; margin-bottom:10px;
}
.admin-form .frow{display:flex; gap:8px; margin-top:8px;}
.add-row-btn{
  width:100%; border:1.5px dashed var(--navy-3); background:#fff; color:var(--navy); border-radius:13px;
  padding:12px; font-family:'Prompt'; font-weight:700; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:14px;
}

/* print */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; left:0; top:0; width:100%; padding:24px; color:#000;}
  .print-hd{display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid #0B1731; padding-bottom:10px; margin-bottom:16px;}
  .print-hd h1{font-size:18px;}
  .print-hd .d{font-size:11px; color:#555;}
  .print-tbl{width:100%; border-collapse:collapse; font-size:11px; margin-top:8px;}
  .print-tbl th, .print-tbl td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  .print-tbl th{background:#f0f0f0;}
  .print-kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #ddd; font-size:12.5px;}
  .print-kv .k{color:#555;}
}

.login-wrap{display:flex; align-items:center; justify-content:center; min-height:70vh; padding:20px;}
.login-card{background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px 22px; width:100%; max-width:320px; text-align:center;}
.login-card .ic{width:52px; height:52px; border-radius:14px; background:var(--navy); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.login-card .ic svg{width:26px; height:26px; color:var(--amber);}
.login-card h2{font-size:16px; font-weight:700; margin-bottom:4px;}
.login-card p{font-size:12px; color:var(--mute); margin-bottom:18px;}
.login-card input{width:100%; padding:12px; border-radius:11px; border:1px solid var(--line); font-family:'Prompt'; font-size:14px; text-align:center; margin-bottom:10px;}
.login-err{font-size:12px; color:var(--red); margin-bottom:8px; min-height:16px;}
.loading-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; gap:14px; color:var(--mute);}
.spinner{width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--navy); animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-banner{background:var(--red-bg); color:var(--red); border-radius:12px; padding:12px 14px; font-size:12.5px; font-weight:600; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.error-banner svg{width:16px;height:16px; flex:0 0 auto;}
.badge-cloud{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--green-bg); color:var(--green);}
.badge-cloud svg{width:11px;height:11px;}
</style></head>
<body>
<div class="shell" id="shell"></div>
<div id="printArea"></div>
<script>
/* =========================================================
   แอปตรวจความปลอดภัย — Frontend
   เชื่อมต่อ Google Sheets ผ่าน Google Apps Script Web App
   ========================================================= */

const CONFIG = {
  // วาง URL ของ Apps Script Web App ที่ deploy แล้ว (ลงท้ายด้วย /exec) ตรงนี้
  API_URL: "https://script.google.com/macros/s/AKfycbz1wDwZGfLh8GJAwI6r-gqiLrctuZaIJpOM9punWFqr3FFrcph_KWC6tJU5GX3NXyqcEw/exec"
};

/* ---------------- icon set ---------------- */
const ic = {
  shield:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>`,
  bell:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`,
  chevleft:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
  arrow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>`,
  clipboard:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M9 11h6M9 15h6"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  tasks:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>`,
  camera:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.4"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,

/* ---------------- API layer ---------------- */
async function apiGet() {
  const res = await fetch(CONFIG.API_URL, { method: "GET" });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || "โหลดข้อมูลไม่สำเร็จ");
  return json.data;
}

async function apiPost(action, payload, password) {
  const body = JSON.stringify({ action, payload, password: password || undefined });
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // กัน CORS preflight กับ Apps Script
    body
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || "ทำรายการไม่สำเร็จ");
  return json.data;
}

async function loadAllData() {
  state.view = "loading";
  render();
  try {
    const data = await apiGet();
    AREAS = data.areas || [];
    INSPECT_TYPES = data.types || [];
    CHECKLIST_ITEMS = data.checklist || [];
    RESPONSIBLES = data.people || [];
    tasks = data.issues || [];
    state.view = "home";
    state.loadError = null;
  } catch (err) {
    state.loadError = err.message;
    state.view = "error";
  }
  render();
}

  t.classList.add("show");
  clearTimeout(window.__tt);

}

function todayThai(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear() + 543;
  return `${dd}/${mm}/${yyyy}`;
}

/* ---------------- image capture + compression ---------------- */
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function triggerPhotoInput(onDone){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.capture = "environment";
  input.onchange = async ()=>{
    const file = input.files[0];
    if (!file) return;
    toastMsg("กำลังประมวลผลภาพ...");
    try{
      const dataUrl = await compressImage(file);
      onDone(dataUrl, file.name);
    }catch(e){
      toastMsg("ไม่สามารถอ่านไฟล์ภาพได้", ic.warn);
    }
  };
  input.click();
}

async function doLogin(){
  const input = document.getElementById("login-pass-input");

  state.busy = true; state.loginError=""; render();
  try{
    await apiPost("login", { password: pass });

    state.busy = false;
    nav("admin");
  }catch(err){
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

      <div class="donut-row">
        ${donutSVG(byRisk)}
        <div class="legend">
          ${Object.keys(byRisk).map(k=>`
            <div class="item">
              <div class="sw" style="background:${riskColors[k]}"></div>
              ระดับ${k}
              <div class="pct">${byRisk[k]}</div>
            </div>`).join("")}
        </div>
      </div>
    </div>

    <div class="section-label"><span class="dash"></span>งานที่ต้องติดตามด่วน</div>
    ${tasks.filter(t=>t.Status!=="Closed").length===0 ? `<div class="empty">${ic.inbox}<div class="t">ยังไม่มีงานค้าง</div></div>` :
      tasks.filter(t=>t.Status!=="Closed").sort((a,b)=> (a.Risk==="สูง"?0:1)-(b.Risk==="สูง"?0:1)).slice(0,3).map(t=>taskCard(t)).join("")}
    <div style="height:6px"></div>
  `;
}

function donutSVG(byRisk){
  const total = byRisk["สูง"]+byRisk["กลาง"]+byRisk["ต่ำ"] || 1;
  const colors = {"สูง":"#DC2626","กลาง":"#D99A00","ต่ำ":"#16A34A"};
  let acc = 0;
  const r=30, cx=40, cy=40, circ=2*Math.PI*r;
  const segs = ["สูง","กลาง","ต่ำ"].map(k=>{
    const frac = byRisk[k]/total;
    const dash = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[k]}" stroke-width="11"
      stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
    return seg;
  }).join("");
  return `<svg width="80" height="80" viewBox="0 0 80 80" style="flex:0 0 auto">
    <circle cx="40" cy="40" r="30" fill="none" stroke="#EEF0F4" stroke-width="11"/>
    ${segs}
    <text x="40" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#161E33" font-family="Prompt">${total===1 && byRisk["สูง"]+byRisk["กลาง"]+byRisk["ต่ำ"]===0?0:byRisk["สูง"]+byRisk["กลาง"]+byRisk["ต่ำ"]}</text>
  </svg>`;
}

function openTask(id){ state.modalTask = id; render(); }

function renderTaskModal(id){

  return `<div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-handle"></div>

        <div>
          <div class="area">${t.Area}</div>
          <div style="font-size:16px; font-weight:700; margin-top:2px;">${t.Issue}</div>
        </div>

        ${STATUS_ORDER.map((s,i)=>`
          <div class="progress-step ${i<idx?'done':''} ${i===idx?'now':''}">

        <div class="detail-row"><div class="k">ผู้รับผิดชอบ</div><div class="v">${t.Responsible}</div></div>
        <div class="detail-row"><div class="k">วันที่พบปัญหา</div><div class="v">${t.Opened}</div></div>
        <div class="detail-row"><div class="k">กำหนดแก้ไข</div><div class="v">${t.DueDate}</div></div>
        <div class="detail-row"><div class="k">สถานะปัจจุบัน</div><div class="v"><span class="status-pill status-${t.Status}">${STATUS_LABEL[t.Status]}</span></div></div>
        ${t.PhotoBeforeURL ? `<div class="detail-row"><div class="k">ภาพก่อนแก้ไข</div><div class="v"><a href="${t.PhotoBeforeURL}" target="_blank" style="color:var(--blue)">เปิดดูภาพ</a></div></div>` : ""}
        ${t.PhotoAfterURL ? `<div class="detail-row"><div class="k">ภาพหลังแก้ไข</div><div class="v"><a href="${t.PhotoAfterURL}" target="_blank" style="color:var(--blue)">เปิดดูภาพ</a></div></div>` : ""}
      </div>

      ${t.Status!=="Closed" ? `
        <button class="btn-primary" style="margin-top:18px" onclick="advanceTask('${t.ID}')" ${state.busy?'disabled':''}>
          ${ic.check}${state.busy?'กำลังบันทึก...':nextLabel}
        </button>` :
        `<div style="margin-top:18px; text-align:center; color:var(--green); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px;">${ic.shield.replace(/currentColor/g,'var(--green)')} Safety Verified &amp; ปิดงานแล้ว</div>`
      }
      <button class="btn-secondary" onclick="printTask('${t.ID}')">${ic.printer}พิมพ์รายงานนี้</button>
      <button class="btn-secondary" onclick="closeModal()">ปิดหน้าต่าง</button>
    </div>
  </div>`;
}

async function advanceTask(id){
  const t = tasks.find(x=>String(x.ID)===String(id));
  if (!t) return;
  const idx = STATUS_ORDER.indexOf(t.Status);
  const nextStatus = STATUS_ORDER[idx+1];
  if (!nextStatus) return;

  const doUpdate = async (photoAfterData, photoAfterName)=>{
    setBusy(true);
    try{
      const updated = await apiPost("updateIssueStatus", {
        id: t.ID, status: nextStatus,
        photoAfterBase64: photoAfterData || undefined,
        photoAfterName: photoAfterName || undefined
      });
      Object.assign(t, updated);
      const msgs = {
        Assigned:"มอบหมายงานเรียบร้อย — แจ้งเตือนผ่าน Email/Teams แล้ว",
        InProgress:"เริ่มดำเนินการแก้ไขแล้ว",
        Waiting:"ส่งผลให้ Safety Officer ตรวจสอบแล้ว",
        Closed:"ปิดงานสำเร็จ — บันทึกภาพหลังแก้ไขเรียบร้อย"
      };
      toastMsg(msgs[nextStatus] || "อัปเดตสถานะแล้ว");
    }catch(err){
      toastMsg("อัปเดตไม่สำเร็จ: " + err.message, ic.warn);
    }
    setBusy(false);
  };

  if (nextStatus === "Closed"){
    triggerPhotoInput((dataUrl, name)=> doUpdate(dataUrl, name));
  } else {
    doUpdate();
  }
}

function wizStep3(){

  const areaName = (AREAS.find(a=>String(a.ID)===String(d.areaId))||{}).Name || "";
  const typeName = (INSPECT_TYPES.find(a=>String(a.ID)===String(d.typeId))||{}).Name || "";

    <button class="btn-primary" onclick="submitInspection()" ${state.busy?'disabled':''}>${ic.send}${state.busy?'กำลังบันทึก...':'บันทึกและแจ้งเตือนผู้รับผิดชอบ'}</button>

function setResult(i,v){ state.draft.checks[i].result = v; render(); }
function setRisk(i,v){ state.draft.checks[i].risk = v; render(); }
function setResp(i,v){ state.draft.checks[i].resp = v; }
function takePhoto(i){
  triggerPhotoInput((dataUrl, name)=>{
    state.draft.checks[i].photoData = dataUrl;
    state.draft.checks[i].photoName = name;
    toastMsg("ถ่ายภาพเรียบร้อย");
    render();
  });
}
function d_area(v){ state.draft.areaId = v; }
function d_type(v){
  state.draft.typeId = v;
  state.draft.checks = checklistForType(v).map(c=>({
    srcId:c.ID, q:c.Text, result:null, risk:"กลาง",
    resp: RESPONSIBLES[0] ? RESPONSIBLES[0].Name : "",
    photoData:null, photoName:null
  }));
}

async function submitInspection(){
  const d = state.draft;
  const areaName = (AREAS.find(a=>String(a.ID)===String(d.areaId))||{}).Name || "";
  const issues = d.checks.filter(c=>c.result==='fail');

  setBusy(true);
  try{
    for (const c of issues){
      const created = await apiPost("addIssue", {
        area: areaName, issue: c.q, risk: c.risk, responsible: c.resp,
        dueDate: todayThai(), opened: todayThai(), status: "Assigned",
        photoBeforeBase64: c.photoData || undefined,
        photoBeforeName: c.photoName || undefined
      });
      tasks.unshift(created);
    }
    toastMsg(issues.length ? `บันทึกสำเร็จ — แจ้งเตือน ${issues.length} รายการผ่าน Email/Teams` : "บันทึกผลตรวจสอบเรียบร้อย", ic.send);
    setBusy(false);
    nav(issues.length ? "tasks" : "home");
  }catch(err){
    setBusy(false);
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
    render();
  }
}

/* ---------------- ADMIN PANEL ---------------- */
function adminTab(t){ state.adminTab=t; state.adminEditId=null; state.adminAdding=false; render(); }

function renderAdmin(){
  const tabs = [
    {k:"areas", label:"พื้นที่"},
    {k:"types", label:"ประเภทตรวจ"},
    {k:"checklist", label:"รายการตรวจสอบ"},
    {k:"people", label:"ผู้รับผิดชอบ"}
  ];
  return `
    <div class="tabs">
      ${tabs.map(t=>`<div class="tab-chip ${state.adminTab===t.k?'active':''}" onclick="adminTab('${t.k}')">${t.label}</div>`).join("")}
    </div>
    ${state.adminTab==="areas" ? renderAdminSimple(AREAS, "areas", "เพิ่มพื้นที่ใหม่") : ""}
    ${state.adminTab==="types" ? renderAdminSimple(INSPECT_TYPES, "types", "เพิ่มประเภทการตรวจ") : ""}
    ${state.adminTab==="checklist" ? renderAdminChecklist() : ""}
    ${state.adminTab==="people" ? renderAdminSimple(RESPONSIBLES, "people", "เพิ่มผู้รับผิดชอบ") : ""}
  `;
}

function entityMeta(entity){
  if (entity==="areas") return {arr:AREAS, action:"Area"};
  if (entity==="types") return {arr:INSPECT_TYPES, action:"Type"};
  if (entity==="people") return {arr:RESPONSIBLES, action:"Person"};
  return null;
}

function renderAdminSimple(items, entity, addLabel){
  const editId = state.adminEditId;
  const adding = state.adminAdding;
  let html = "";
  if(adding){
    html += `<div class="admin-form">
      <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px;">ชื่อใหม่</label>
      <input type="text" id="admin-new-input" placeholder="พิมพ์ชื่อ..." onkeydown="if(event.key==='Enter')adminConfirmAdd('${entity}')">
      <div class="frow">
        <button class="btn-sm" style="flex:1" onclick="adminCancelAdd()">ยกเลิก</button>
        <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminConfirmAdd('${entity}')" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
      </div>
    </div>`;
  } else {
    html += `<button class="add-row-btn" onclick="adminStartAdd()">${ic.plus} ${addLabel}</button>`;
  }

  items.forEach(item=>{
    if(String(editId)===String(item.ID)){
      html += `<div class="admin-form">
        <input type="text" id="admin-edit-input-${item.ID}" value="${String(item.Name).replace(/"/g,'&quot;')}">
        <div class="frow">
          <button class="btn-sm" style="flex:1" onclick="adminCancelEdit()">ยกเลิก</button>
          <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminSaveSimpleEdit('${entity}','${item.ID}')" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
        </div>
      </div>`;
    } else {
      html += `<div class="admin-row">
        <div class="info"><div class="nm">${item.Name}</div></div>
        <div class="acts">
          <div class="icon-sm" onclick="adminStartEdit('${item.ID}')">${ic.pencil}</div>
          <div class="icon-sm danger" onclick="adminDeleteSimple('${entity}','${item.ID}')">${ic.trash}</div>
        </div>
      </div>`;
    }
  });
  return html;
}

function adminStartAdd(){ state.adminAdding=true; state.adminEditId=null; render(); document.getElementById("admin-new-input")?.focus(); }
function adminCancelAdd(){ state.adminAdding=false; render(); }
function adminStartEdit(id){ state.adminEditId=id; state.adminAdding=false; render(); }
function adminCancelEdit(){ state.adminEditId=null; render(); }

async function adminConfirmAdd(entity){
  const input = document.getElementById("admin-new-input");
  const val = input ? input.value.trim() : "";
  if(!val){ toastMsg("กรุณากรอกชื่อก่อนบันทึก", ic.warn); return; }
  const meta = entityMeta(entity);
  setBusy(true);
  try{
    const created = await apiPost("add"+meta.action, { Name: val }, adminPassword);
    meta.arr.push(created);
    state.adminAdding = false;
    toastMsg("เพิ่มรายการเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminSaveSimpleEdit(entity, id){
  const input = document.getElementById("admin-edit-input-"+id);
  const val = input ? input.value.trim() : "";
  if(!val){ toastMsg("กรุณากรอกชื่อก่อนบันทึก", ic.warn); return; }
  const meta = entityMeta(entity);
  setBusy(true);
  try{
    const updated = await apiPost("update"+meta.action, { id, Name: val }, adminPassword);
    const item = meta.arr.find(x=>String(x.ID)===String(id));
    if (item) Object.assign(item, updated);
    state.adminEditId = null;
    toastMsg("บันทึกการแก้ไขเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminDeleteSimple(entity, id){
  if(!confirm("ยืนยันการลบรายการนี้หรือไม่?")) return;
  const meta = entityMeta(entity);
  setBusy(true);
  try{
    await apiPost("delete"+meta.action, { id }, adminPassword);
    if (entity==="areas") AREAS = AREAS.filter(x=>String(x.ID)!==String(id));
    if (entity==="types"){
      INSPECT_TYPES = INSPECT_TYPES.filter(x=>String(x.ID)!==String(id));
      CHECKLIST_ITEMS.forEach(c=>{ if(String(c.TypeID)===String(id)) c.TypeID=""; });
    }
    if (entity==="people") RESPONSIBLES = RESPONSIBLES.filter(x=>String(x.ID)!==String(id));
    toastMsg("ลบรายการแล้ว");
  }catch(err){
    toastMsg("ลบไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

/* --- checklist (text + type) --- */
function renderAdminChecklist(){
  const editId = state.adminEditId;
  const adding = state.adminAdding;
  const typeOptions = (selVal)=> `<option value="" ${!selVal?'selected':''}>ทุกประเภท</option>` +
    INSPECT_TYPES.map(t=>`<option value="${t.ID}" ${String(selVal)===String(t.ID)?'selected':''}>${t.Name}</option>`).join("");

  let html = "";
  if(adding){
    html += `<div class="admin-form">
      <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px;">ข้อความรายการตรวจ</label>
      <textarea id="cl-new-text" placeholder="เช่น ตรวจสอบสายไฟไม่มีรอยชำรุด"></textarea>
      <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">ใช้กับประเภทตรวจ</label>
      <select id="cl-new-type">${typeOptions("")}</select>
      <div class="frow">
        <button class="btn-sm" style="flex:1" onclick="adminCancelAdd()">ยกเลิก</button>
        <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminConfirmAddChecklist()" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
      </div>
    </div>`;
  } else {
    html += `<button class="add-row-btn" onclick="adminStartAdd()">${ic.plus} เพิ่มรายการตรวจสอบ</button>`;
  }

  CHECKLIST_ITEMS.forEach(item=>{
    const typeName = !item.TypeID ? "ทุกประเภท" : ((INSPECT_TYPES.find(t=>String(t.ID)===String(item.TypeID))||{}).Name || "ทุกประเภท");
    if(String(editId)===String(item.ID)){
      html += `<div class="admin-form">
        <textarea id="cl-edit-text-${item.ID}">${item.Text}</textarea>
        <select id="cl-edit-type-${item.ID}" style="margin-top:8px">${typeOptions(item.TypeID)}</select>
        <div class="frow">
          <button class="btn-sm" style="flex:1" onclick="adminCancelEdit()">ยกเลิก</button>
          <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminSaveChecklistEdit('${item.ID}')" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
        </div>
      </div>`;
    } else {
      html += `<div class="admin-row">
        <div class="info"><div class="nm">${item.Text}</div><div class="tg">${typeName}</div></div>
        <div class="acts">
          <div class="icon-sm" onclick="adminStartEdit('${item.ID}')">${ic.pencil}</div>
          <div class="icon-sm danger" onclick="adminDeleteChecklist('${item.ID}')">${ic.trash}</div>
        </div>
      </div>`;
    }
  });
  return html;
}

async function adminConfirmAddChecklist(){
  const text = document.getElementById("cl-new-text")?.value.trim();
  const typeVal = document.getElementById("cl-new-type")?.value;
  if(!text){ toastMsg("กรุณากรอกข้อความก่อนบันทึก", ic.warn); return; }
  setBusy(true);
  try{
    const created = await apiPost("addChecklist", { Text: text, TypeID: typeVal || "" }, adminPassword);
    CHECKLIST_ITEMS.push(created);
    state.adminAdding = false;
    toastMsg("เพิ่มรายการตรวจสอบเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminSaveChecklistEdit(id){
  const text = document.getElementById("cl-edit-text-"+id)?.value.trim();
  const typeVal = document.getElementById("cl-edit-type-"+id)?.value;
  if(!text){ toastMsg("กรุณากรอกข้อความก่อนบันทึก", ic.warn); return; }
  setBusy(true);
  try{
    const updated = await apiPost("updateChecklist", { id, Text: text, TypeID: typeVal || "" }, adminPassword);
    const item = CHECKLIST_ITEMS.find(x=>String(x.ID)===String(id));
    if (item) Object.assign(item, updated);
    state.adminEditId = null;
    toastMsg("บันทึกการแก้ไขเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminDeleteChecklist(id){
  if(!confirm("ยืนยันการลบรายการตรวจสอบนี้หรือไม่?")) return;
  setBusy(true);
  try{
    await apiPost("deleteChecklist", { id }, adminPassword);
    CHECKLIST_ITEMS = CHECKLIST_ITEMS.filter(x=>String(x.ID)!==String(id));
    toastMsg("ลบรายการแล้ว");
  }catch(err){
    toastMsg("ลบไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

/* ---------------- bottom nav ---------------- */
function renderBottomNav(){
  const openCount = tasks.filter(t=>t.Status!=="Closed").length;
  return `<div class="bottomnav">
    <button class="nav-btn ${state.view==='home'?'active':''}" onclick="nav('home')">${ic.home}<span>หน้าหลัก</span></button>
    <button class="nav-btn" onclick="nav('new')"><div class="fab">${ic.plus}</div></button>
    <button class="nav-btn ${state.view==='tasks'?'active':''}" onclick="nav('tasks')">
      ${ic.tasks}<span>งานของฉัน</span>
      ${openCount ? `<div class="dot">${openCount}</div>` : ""}
    </button>
  </div>`;
}

/* ---------------- boot ---------------- */
loadAllData();
</script>

</html>
