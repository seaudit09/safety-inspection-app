<style>

:root{
  --navy:#0B1731;
  --navy-2:#132A52;
  --navy-3:#1C3866;
  --amber:#F5B700;
  --amber-2:#D99A00;
  --orange:#E8543E;
  --green:#16A34A;
  --green-bg:#E7F7EC;
  --red:#DC2626;
  --red-bg:#FDEBEB;
  --blue:#2563EB;
  --blue-bg:#EAF1FE;
  --bg:#F1F3F7;
  --card:#FFFFFF;
  --ink:#161E33;
  --mute:#697088;
  --line:#E4E7EF;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Prompt', sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.shell{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 60px rgba(11,23,49,0.15);
}

.hazard-strip{
  height:6px;
  width:100%;
  background:repeating-linear-gradient(135deg,var(--amber) 0 14px, var(--navy) 14px 28px);
  flex:0 0 auto;
}

.topbar{
  background:var(--navy);
  color:#fff;
  padding:18px 18px 22px;
  position:relative;
  flex:0 0 auto;
}
.topbar .row{display:flex; align-items:center; justify-content:space-between;}
.topbar .brand{display:flex; align-items:center; gap:10px;}
.topbar .brand .logo-badge{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(145deg,var(--amber),var(--amber-2));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(0,0,0,0.25);
}
.topbar .brand .logo-badge svg{width:19px; height:19px;}
.topbar h1{font-size:15px; font-weight:700; letter-spacing:0.2px;}
.topbar .sub{font-size:11px; color:#93A2C4; margin-top:1px;}
.icon-btn{
  width:34px; height:34px; border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  display:flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; flex:0 0 auto;
}
.icon-btn svg{width:16px; height:16px;}
.icon-group{display:flex; gap:8px;}
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
.back-row .icon-btn{width:30px;height:30px;}
.page-title{font-size:18px; font-weight:700;}
.page-sub{font-size:12px; color:#93A2C4; margin-top:2px;}

.content{
  flex:1 1 auto;
  overflow-y:auto;
  padding:16px 16px 100px;
}

/* ---------------- API layer ---------------- */
async function apiGet() {
  const res = await fetch(CONFIG.API_URL, { method: "GET" });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || "โหลดข้อมูลไม่สำเร็จ");
  return json.data;
}

async function apiPost(action, payload, password) {
  const body = JSON.stringify({ action, payload, password: password || undefined });
  const res = await fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // กัน CORS preflight กับ Apps Script
    body
  });
  const json = await res.json();
  if (!json.success) throw new Error(json.error || "ทำรายการไม่สำเร็จ");
  return json.data;
}

async function loadAllData() {
  state.view = "loading";
  render();
  try {
    const data = await apiGet();
    AREAS = data.areas || [];
    INSPECT_TYPES = data.types || [];
    CHECKLIST_ITEMS = data.checklist || [];
    RESPONSIBLES = data.people || [];
    INSPECTORS = data.inspectorsList || [];
    tasks = data.issues || [];
    PLANS = data.plans || [];
    INSPECTIONS = data.inspections || [];
    state.view = "home";
    state.loadError = null;
  } catch (err) {
    state.loadError = err.message;
    state.view = "error";
  }
  render();
}

function todayThai(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear() + 543;
  return `${dd}/${mm}/${yyyy}`;
}

/* ---------------- ตัวช่วยจัดรูปแบบวันที่แบบไทย ---------------- */
const TH_MONTHS = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

// แสดงผลวันที่แบบไทยเต็มรูปแบบ "21 สิงหาคม 2569" — รับได้ทั้ง dd/mm/yyyy (พ.ศ., รูปแบบหลักที่แอปนี้ใช้)
// และ yyyy-mm-dd (ISO จาก <input type="date">) เผื่อกรณีข้อมูลเก่าหรือมาจากแหล่งอื่น
function thaiDateDisplay(s){
  if(!s) return "-";
  let dd, mm, yyyy;
  const iso = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const thai = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (iso){
    yyyy = Number(iso[1]) + 543; mm = Number(iso[2]); dd = Number(iso[3]);
  } else if (thai){
    dd = Number(thai[1]); mm = Number(thai[2]); yyyy = Number(thai[3]);
  } else {
    return s; // รูปแบบไม่รู้จัก แสดงตามที่มีไว้ก่อน ป้องกันข้อมูลหาย
  }
  if (!TH_MONTHS[mm]) return s;
  return `${dd} ${TH_MONTHS[mm]} ${yyyy}`;
}

// แปลง dd/mm/yyyy (พ.ศ. หรือ ค.ศ.) ให้เป็น yyyy-mm-dd (ค.ศ.) สำหรับใส่ใน <input type="date">
function thaiDateToIso(s){
  if(!s) return "";
  const m = String(s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return "";
  const dd = m[1], mo = m[2];
  let y = Number(m[3]);
  if (y > 2400) y -= 543; // เป็นปี พ.ศ. ให้แปลงกลับเป็น ค.ศ.
  return `${String(y).padStart(4,'0')}-${String(mo).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

// แปลงค่าจาก <input type="date"> (yyyy-mm-dd แบบ ค.ศ.) กลับเป็น dd/mm/yyyy พ.ศ. เพื่อเก็บให้ตรงรูปแบบเดียวกับทั้งระบบ
function isoToThaiDate(iso){
  if(!iso) return "";
  const m = String(iso).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return "";
  const yyyy = Number(m[1]) + 543;
  return `${String(m[3]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${yyyy}`;
}

// คีย์สำหรับเรียงลำดับวันที่ dd/mm/yyyy ให้ถูกต้องตามเวลาจริง (เรียงแบบ string ตรงๆ จะผิดข้ามเดือน/ปี)
function sortableDateKey(s){
  const m = String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return String(s||"");
  return `${m[3].padStart(4,'0')}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}

/* ---------------- image capture + compression ---------------- */
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function triggerPhotoInput(onDone, useCamera){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  if (useCamera) input.capture = "environment"; // เปิดกล้องโดยตรง; ถ้าไม่ใส่ค่านี้จะเปิดคลังภาพ/ไฟล์แทน
  input.onchange = async ()=>{
    const file = input.files[0];
    if (!file) return;
    toastMsg("กำลังประมวลผลภาพ...");
    try{
      const dataUrl = await compressImage(file);
      onDone(dataUrl, file.name);
    }catch(e){
      toastMsg("ไม่สามารถอ่านไฟล์ภาพได้", ic.warn);
    }
  };
  input.click();
}

  state.modalTask = null;

    state.adminEditId = null; state.adminAdding = false;

function freshDraft(planId){
  let areaId = AREAS[0] ? AREAS[0].ID : "";
  let typeId = INSPECT_TYPES[0] ? INSPECT_TYPES[0].ID : "";
  let inspectorName = lastInspectorName || (INSPECTORS[0] ? INSPECTORS[0].Name : "Safety Officer");
  if (planId){
    const plan = PLANS.find(p=>String(p.ID)===String(planId));
    if (plan){
      const a = AREAS.find(x=>x.Name===plan.Area);
      const t = INSPECT_TYPES.find(x=>x.Name===plan.Type);
      if (a) areaId = a.ID;
      if (t) typeId = t.ID;
      if (plan.Assignee) inspectorName = plan.Assignee;
    }
  }
  return {
    planId: planId || null,
    areaId,
    typeId,
    inspectorName,
    date: todayThai(),
    checks: checklistForType(typeId).map(c=>({
      srcId:c.ID, q:c.Text, selected:true, result:null, risk:"กลาง",
      resp: RESPONSIBLES[0] ? RESPONSIBLES[0].Name : "",
      photoData:null, photoName:null
    }))
  };
}

function checklistForType(typeId){
  return CHECKLIST_ITEMS.filter(c => !c.TypeID || String(c.TypeID)==="" || String(c.TypeID)===String(typeId));
}

async function doLogin(){
  const input = document.getElementById("login-pass-input");
  const pass = input ? input.value : "";
  if (!pass){ state.loginError = "กรุณากรอกรหัสผ่าน"; render(); return; }
  state.busy = true; state.loginError=""; render();
  try{
    await apiPost("login", { password: pass });

    state.busy = false;
    nav("admin");
  }catch(err){
    state.busy = false;
    state.loginError = err.message;
    render();
  }
}

function donutSVG(byRisk){
  const total = byRisk["สูง"]+byRisk["กลาง"]+byRisk["ต่ำ"] || 1;
  const colors = {"สูง":"#DC2626","กลาง":"#D99A00","ต่ำ":"#16A34A"};
  let acc = 0;
  const r=30, cx=40, cy=40, circ=2*Math.PI*r;
  const segs = ["สูง","กลาง","ต่ำ"].map(k=>{
    const frac = byRisk[k]/total;
    const dash = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[k]}" stroke-width="11"
      stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
    return seg;
  }).join("");
  return `<svg width="80" height="80" viewBox="0 0 80 80" style="flex:0 0 auto">
    <circle cx="40" cy="40" r="30" fill="none" stroke="#EEF0F4" stroke-width="11"/>
    ${segs}
    <text x="40" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#161E33" font-family="Prompt">${total===1 && byRisk["สูง"]+byRisk["กลาง"]+byRisk["ต่ำ"]===0?0:byRisk["สูง"]+byRisk["กลาง"]+byRisk["ต่ำ"]}</text>
  </svg>`;
}

async function saveTaskEdit(id){
  const existing = tasks.find(x=>String(x.ID)===String(id));
  const d = state.taskEditDraft || {};
  // สำคัญ: คีย์ที่ส่งไปต้องตรงกับชื่อหัวคอลัมน์ในชีท Issues เป๊ะๆ (Area, Issue, Risk, Responsible, DueDate)
  // เพราะฝั่ง Apps Script (updateRow) จับคู่คีย์ตามชื่อหัวคอลัมน์ตรงๆ แบบ case-sensitive
  // ก่อนหน้านี้ส่งเป็นตัวพิมพ์เล็ก (area, issue, ...) ทำให้ไม่ตรงกับหัวคอลัมน์เลยสักตัว จึงไม่มีฟิลด์ไหนถูกบันทึกจริง
  const vals = {
    id,
    Area: d.area,
    Issue: (d.issue||"").trim(),
    Risk: d.risk,
    Responsible: d.responsible,
    DueDate: d.dueDate || (existing ? existing.DueDate : "")
  };
  if(!vals.Issue){ toastMsg("กรุณากรอกรายละเอียดปัญหา", ic.warn); return; }
  setBusy(true);
  try{
    const updated = await apiPost("updateIssue", vals);
    const t = tasks.find(x=>String(x.ID)===String(id));
    if (t) Object.assign(t, updated);
    state.taskEditId = null;
    state.taskEditDraft = null;
    toastMsg("บันทึกการแก้ไขเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function advanceTask(id){
  const t = tasks.find(x=>String(x.ID)===String(id));
  if (!t) return;
  const idx = STATUS_ORDER.indexOf(t.Status);
  const nextStatus = STATUS_ORDER[idx+1];
  if (!nextStatus || nextStatus === "Closed") return; // ปิดงานได้เฉพาะผู้ดูแลระบบอนุมัติเท่านั้น ดู adminApproveClose()

  const doUpdate = async (photoAfterData, photoAfterName)=>{
    setBusy(true);
    try{
      const updated = await apiPost("updateIssueStatus", {
        id: t.ID, status: nextStatus,
        photoAfterBase64: photoAfterData || undefined,
        photoAfterName: photoAfterName || undefined
      });
      Object.assign(t, updated);
      const msgs = {
        Assigned:"มอบหมายงานเรียบร้อย — แจ้งเตือนผ่าน Email/Teams แล้ว",
        InProgress:"เริ่มดำเนินการแก้ไขแล้ว",
        Waiting:"ส่งผลให้ Safety Officer ตรวจสอบแล้ว",
        PendingApproval:"ส่งภาพหลังแก้ไขแล้ว — รอผู้ดูแลระบบตรวจสอบและอนุมัติปิดงาน"
      };
      toastMsg(msgs[nextStatus] || "อัปเดตสถานะแล้ว");
    }catch(err){
      toastMsg("อัปเดตไม่สำเร็จ: " + err.message, ic.warn);
    }
    setBusy(false);
  };

  if (nextStatus === "PendingApproval"){
    choosePhotoSource((dataUrl, name)=> doUpdate(dataUrl, name));
  } else {
    doUpdate();
  }
}

// URL รูปที่บันทึกไว้เป็นแบบ "https://drive.google.com/uc?id=FILEID" ซึ่งบางครั้ง Google Drive
// จะเปลี่ยนไปแสดงหน้ายืนยัน/สแกนไวรัสแทนตัวรูปจริงเวลาฝังตรงใน <img>, ทำให้รูปไม่ขึ้น (โดยเฉพาะตอนพิมพ์รายงาน)
// จึงแปลงเป็น endpoint "thumbnail" ของ Google Drive แทน ซึ่งเสถียรกว่ามากสำหรับการฝังรูปแบบนี้
function driveThumb(url, size){
  if(!url) return url;
  const m = String(url).match(/[?&]id=([^&]+)/);
  if(!m) return url;
  return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w${size||1000}`;
}

// รอให้รูปทุกรูปในพื้นที่ที่จะพิมพ์โหลดเสร็จก่อนค่อยเปิดหน้าต่างพิมพ์ (มี timeout กันค้าง)
// แก้ปัญหาเดิมที่สั่ง window.print() ทันทีหลังใส่ <img> ลงไป ทำให้รูปยังโหลดไม่ทันจึงไม่ขึ้นในพรีวิว
function waitForPrintImages(container, timeoutMs=4000){
  const imgs = Array.from(container.querySelectorAll("img"));
  if(!imgs.length) return Promise.resolve();
  return Promise.all(imgs.map(img => new Promise(resolve=>{
    if (img.complete && img.naturalWidth > 0) return resolve();
    const done = ()=>resolve();
    img.addEventListener("load", done, {once:true});
    img.addEventListener("error", ()=>{
      img.closest(".print-photo")?.querySelector(".cap")?.insertAdjacentHTML("beforebegin", `<div style="font-size:11px;color:#c00;">(โหลดรูปไม่สำเร็จ — เปิดดูได้จากลิงก์ในเว็บ)</div>`);
      done();
    }, {once:true});
    setTimeout(done, timeoutMs);
  })));
}

// แปลงเนื้อหาใน #printArea เป็นรูปภาพด้วย html2canvas แล้วฝังลงไฟล์ PDF จริงด้วย jsPDF (แบ่งหน้าอัตโนมัติถ้ายาวเกิน 1 หน้า A4)
async function exportPrintAreaAsPdf(filename){
  const area = document.getElementById("printArea");
  if (!area || !window.html2canvas || !window.jspdf){
    toastMsg("ไม่สามารถโหลดตัวสร้างไฟล์ PDF ได้ — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต", ic.warn);
    return;
  }
  toastMsg("กำลังสร้างไฟล์ PDF...");
  try{
    area.style.display = "block"; // html2canvas ต้องการให้ element มองเห็นได้ชั่วคราวขณะ capture
    const canvas = await window.html2canvas(area, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
    area.style.display = "";

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = (canvas.height * imgW) / canvas.width;
    const imgData = canvas.toDataURL("image/jpeg", 0.92);

    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
    heightLeft -= pageH;
    while (heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    pdf.save(filename);
    toastMsg("ดาวน์โหลดไฟล์ PDF เรียบร้อย");
  }catch(err){
    area.style.display = "";
    toastMsg("สร้างไฟล์ PDF ไม่สำเร็จ: " + err.message, ic.warn);
  }
}

async function submitInspection(){
  const d = state.draft;
  const areaName = (AREAS.find(a=>String(a.ID)===String(d.areaId))||{}).Name || "";
  const typeName = (INSPECT_TYPES.find(a=>String(a.ID)===String(d.typeId))||{}).Name || "";
  const active = d.checks.filter(c=>c.selected);
  const issues = active.filter(c=>c.result==='fail');
  const passedCount = active.filter(c=>c.result==='pass').length;

  setBusy(true);
  try{
    if (issues.length){
      // ส่งงานแก้ไขทั้งหมดในคำขอเดียว (แทนที่จะวนส่งทีละรายการ) ช่วยให้บันทึกเร็วขึ้นมาก
      // โดยเฉพาะเมื่อพบปัญหาหลายข้อพร้อมกัน เพราะลดจำนวนรอบการเชื่อมต่อไปที่ Apps Script
      const created = await apiPost("addIssuesBatch", {
        issues: issues.map(c=>({
          area: areaName, issue: c.q, risk: c.risk, responsible: c.resp,
          dueDate: todayThai(), opened: todayThai(), status: "Assigned",
          photoBeforeBase64: c.photoData || undefined,
          photoBeforeName: c.photoName || undefined
        }))
      });
      created.forEach(item => tasks.unshift(item));
    }
    // บันทึกประวัติการตรวจทุกครั้งไว้เสมอ ไม่ว่าจะพบปัญหาหรือไม่ก็ตาม
    // เพื่อให้ค้นหา/ตรวจสอบย้อนหลังได้ (แก้ปัญหา "ตรวจแล้วหางานที่บันทึกไม่เจอ" เมื่อผลตรวจผ่านหมด)
    const inspection = await apiPost("addInspection", {
      area: areaName, type: typeName, date: todayThai(), inspector: d.inspectorName || undefined,
      totalItems: active.length, passedItems: passedCount, issuesCount: issues.length,
      planId: d.planId || undefined
    });
    INSPECTIONS.unshift(inspection);
    if (d.planId){
      const plan = PLANS.find(p=>String(p.ID)===String(d.planId));
      if (plan) plan.Status = "เสร็จสิ้น";
    }
    toastMsg(issues.length ? `บันทึกสำเร็จ — แจ้งเตือน ${issues.length} รายการผ่าน Email/Teams` : "บันทึกผลตรวจสอบเรียบร้อย", ic.send);
    setBusy(false);
    nav(issues.length ? "tasks" : "home");
  }catch(err){
    setBusy(false);
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
    render();
  }
}

function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function backupAllData(){
  const payload = {
    exportedAt: new Date().toISOString(),
    areas: AREAS, types: INSPECT_TYPES, checklist: CHECKLIST_ITEMS,
    people: RESPONSIBLES, inspectorsList: INSPECTORS, issues: tasks, plans: PLANS, inspections: INSPECTIONS
  };
  const dateStr = new Date().toISOString().slice(0,10);
  downloadTextFile(`safety-backup-${dateStr}.json`, JSON.stringify(payload, null, 2), "application/json");
  toastMsg("ดาวน์โหลดไฟล์สำรองเรียบร้อย");
}

function csvEscape(v){
  const s = String(v==null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function exportIssuesCsv(){
  const headers = ["ID","Area","Issue","Risk","Status","Responsible","DueDate","Opened","PhotoBeforeURL","PhotoAfterURL","ClosedDate"];
  const rows = [headers.join(",")];
  tasks.forEach(t=> rows.push(headers.map(h=>csvEscape(t[h])).join(",")));
  const dateStr = new Date().toISOString().slice(0,10);
  downloadTextFile(`safety-issues-${dateStr}.csv`, "\uFEFF" + rows.join("\n"), "text/csv;charset=utf-8");
  toastMsg("ดาวน์โหลดไฟล์ CSV เรียบร้อย");
}

function entityMeta(entity){
  if (entity==="areas") return {arr:AREAS, action:"Area"};

  if (entity==="people") return {arr:RESPONSIBLES, action:"Person"};
  if (entity==="inspectors") return {arr:INSPECTORS, action:"Inspector"};
  return null;
}

async function adminConfirmAdd(entity){
  const input = document.getElementById("admin-new-input");
  const val = input ? input.value.trim() : "";
  if(!val){ toastMsg("กรุณากรอกชื่อก่อนบันทึก", ic.warn); return; }
  const meta = entityMeta(entity);
  setBusy(true);
  try{
    const created = await apiPost("add"+meta.action, { Name: val }, adminPassword);
    meta.arr.push(created);
    state.adminAdding = false;
    toastMsg("เพิ่มรายการเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminSaveSimpleEdit(entity, id){
  const input = document.getElementById("admin-edit-input-"+id);
  const val = input ? input.value.trim() : "";
  if(!val){ toastMsg("กรุณากรอกชื่อก่อนบันทึก", ic.warn); return; }
  const meta = entityMeta(entity);
  setBusy(true);
  try{
    const updated = await apiPost("update"+meta.action, { id, Name: val }, adminPassword);
    const item = meta.arr.find(x=>String(x.ID)===String(id));
    if (item) Object.assign(item, updated);
    state.adminEditId = null;
    toastMsg("บันทึกการแก้ไขเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminDeleteSimple(entity, id){
  if(!confirm("ยืนยันการลบรายการนี้หรือไม่?")) return;
  const meta = entityMeta(entity);
  setBusy(true);
  try{
    await apiPost("delete"+meta.action, { id }, adminPassword);
    if (entity==="areas") AREAS = AREAS.filter(x=>String(x.ID)!==String(id));
    if (entity==="types"){
      INSPECT_TYPES = INSPECT_TYPES.filter(x=>String(x.ID)!==String(id));
      CHECKLIST_ITEMS.forEach(c=>{ if(String(c.TypeID)===String(id)) c.TypeID=""; });
    }
    if (entity==="people") RESPONSIBLES = RESPONSIBLES.filter(x=>String(x.ID)!==String(id));
    if (entity==="inspectors") INSPECTORS = INSPECTORS.filter(x=>String(x.ID)!==String(id));
    toastMsg("ลบรายการแล้ว");
  }catch(err){
    toastMsg("ลบไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

/* --- checklist (text + type) --- */
function renderAdminChecklist(){
  const editId = state.adminEditId;
  const adding = state.adminAdding;
  const typeOptions = (selVal)=> `<option value="" ${!selVal?'selected':''}>ทุกประเภท</option>` +
    INSPECT_TYPES.map(t=>`<option value="${t.ID}" ${String(selVal)===String(t.ID)?'selected':''}>${t.Name}</option>`).join("");

  let html = "";
  if(adding){
    html += `<div class="admin-form">
      <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px;">ข้อความรายการตรวจ</label>
      <textarea id="cl-new-text" placeholder="เช่น ตรวจสอบสายไฟไม่มีรอยชำรุด"></textarea>
      <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">ใช้กับประเภทตรวจ</label>
      <select id="cl-new-type">${typeOptions("")}</select>
      <div class="frow">
        <button class="btn-sm" style="flex:1" onclick="adminCancelAdd()">ยกเลิก</button>
        <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminConfirmAddChecklist()" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
      </div>
    </div>`;
  } else {
    html += `<button class="add-row-btn" onclick="adminStartAdd()">${ic.plus} เพิ่มรายการตรวจสอบ</button>`;
  }

  CHECKLIST_ITEMS.forEach(item=>{
    const typeName = !item.TypeID ? "ทุกประเภท" : ((INSPECT_TYPES.find(t=>String(t.ID)===String(item.TypeID))||{}).Name || "ทุกประเภท");
    if(String(editId)===String(item.ID)){
      html += `<div class="admin-form">
        <textarea id="cl-edit-text-${item.ID}">${item.Text}</textarea>
        <select id="cl-edit-type-${item.ID}" style="margin-top:8px">${typeOptions(item.TypeID)}</select>
        <div class="frow">
          <button class="btn-sm" style="flex:1" onclick="adminCancelEdit()">ยกเลิก</button>
          <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminSaveChecklistEdit('${item.ID}')" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
        </div>
      </div>`;
    } else {
      html += `<div class="admin-row">
        <div class="info"><div class="nm">${item.Text}</div><div class="tg">${typeName}</div></div>
        <div class="acts">
          <div class="icon-sm" onclick="adminStartEdit('${item.ID}')">${ic.pencil}</div>
          <div class="icon-sm danger" onclick="adminDeleteChecklist('${item.ID}')">${ic.trash}</div>
        </div>
      </div>`;
    }
  });
  return html;
}

async function adminConfirmAddChecklist(){
  const text = document.getElementById("cl-new-text")?.value.trim();
  const typeVal = document.getElementById("cl-new-type")?.value;
  if(!text){ toastMsg("กรุณากรอกข้อความก่อนบันทึก", ic.warn); return; }
  setBusy(true);
  try{
    const created = await apiPost("addChecklist", { Text: text, TypeID: typeVal || "" }, adminPassword);
    CHECKLIST_ITEMS.push(created);
    state.adminAdding = false;
    toastMsg("เพิ่มรายการตรวจสอบเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminSaveChecklistEdit(id){
  const text = document.getElementById("cl-edit-text-"+id)?.value.trim();
  const typeVal = document.getElementById("cl-edit-type-"+id)?.value;
  if(!text){ toastMsg("กรุณากรอกข้อความก่อนบันทึก", ic.warn); return; }
  setBusy(true);
  try{
    const updated = await apiPost("updateChecklist", { id, Text: text, TypeID: typeVal || "" }, adminPassword);
    const item = CHECKLIST_ITEMS.find(x=>String(x.ID)===String(id));
    if (item) Object.assign(item, updated);
    state.adminEditId = null;
    toastMsg("บันทึกการแก้ไขเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminDeleteChecklist(id){
  if(!confirm("ยืนยันการลบรายการตรวจสอบนี้หรือไม่?")) return;
  setBusy(true);
  try{
    await apiPost("deleteChecklist", { id }, adminPassword);
    CHECKLIST_ITEMS = CHECKLIST_ITEMS.filter(x=>String(x.ID)!==String(id));
    toastMsg("ลบรายการแล้ว");
  }catch(err){
    toastMsg("ลบไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

/* --- plans (แผนงานตรวจสอบล่วงหน้า) --- */
const PLAN_STATUSES = ["รอดำเนินการ","เสร็จสิ้น","ยกเลิก"];

// ฟอร์มแผนงานเก็บค่าที่แก้ไขไว้ใน state.planFormDraft เสมอ (ไม่อ่านค่าจาก DOM ตอนกดบันทึก)
// ป้องกันปัญหาค่าที่เพิ่งเลือก (โดยเฉพาะวันที่) ถูกรีเซ็ตกลับเป็นค่าเดิมเวลามีการ re-render ระหว่างทาง เช่นตอนเข้าสถานะ busy
function planDraftSet(field, value){ if (state.planFormDraft) state.planFormDraft[field] = value; }

function adminStartAddPlan(){
  state.adminAdding = true; state.adminEditId = null;
  state.planFormDraft = {
    Area: AREAS[0] ? AREAS[0].Name : "", Type: INSPECT_TYPES[0] ? INSPECT_TYPES[0].Name : "",
    PlannedDate: "", Assignee: RESPONSIBLES[0] ? RESPONSIBLES[0].Name : "", Status: "รอดำเนินการ", Notes: ""
  };
  render();
}
function adminStartEditPlan(id){
  const p = PLANS.find(x=>String(x.ID)===String(id));
  if (!p) return;
  state.adminEditId = id; state.adminAdding = false;
  state.planFormDraft = { Area: p.Area, Type: p.Type, PlannedDate: p.PlannedDate, Assignee: p.Assignee, Status: p.Status, Notes: p.Notes };
  render();
}

function planFormFields(){
  const d = state.planFormDraft || {};
  return `
    <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px;">พื้นที่</label>
    <select onchange="planDraftSet('Area', this.value)">${AREAS.map(a=>`<option ${d.Area===a.Name?'selected':''}>${a.Name}</option>`).join("")}</select>
    <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">ประเภทการตรวจ</label>
    <select onchange="planDraftSet('Type', this.value)">${INSPECT_TYPES.map(t=>`<option ${d.Type===t.Name?'selected':''}>${t.Name}</option>`).join("")}</select>
    <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">วันที่วางแผนตรวจ</label>
    <input type="date" value="${thaiDateToIso(d.PlannedDate||'')}" onchange="planDraftSet('PlannedDate', isoToThaiDate(this.value))">
    <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">ผู้รับผิดชอบตรวจ</label>
    <select onchange="planDraftSet('Assignee', this.value)">${RESPONSIBLES.map(r=>`<option ${d.Assignee===r.Name?'selected':''}>${r.Name}</option>`).join("")}</select>
    <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">สถานะ</label>
    <select onchange="planDraftSet('Status', this.value)">${PLAN_STATUSES.map(s=>`<option ${(d.Status||"รอดำเนินการ")===s?'selected':''}>${s}</option>`).join("")}</select>
    <label style="font-size:12px;font-weight:600;color:var(--mute);display:block;margin:10px 0 6px;">หมายเหตุ (ถ้ามี)</label>
    <textarea oninput="planDraftSet('Notes', this.value)" placeholder="เช่น เน้นตรวจจุดที่เพิ่งซ่อมเสร็จ">${d.Notes||''}</textarea>
  `;
}

function renderAdminPlans(){
  const editId = state.adminEditId;
  const adding = state.adminAdding;
  let html = "";
  if(adding){
    html += `<div class="admin-form">
      ${planFormFields()}
      <div class="frow">
        <button class="btn-sm" style="flex:1" onclick="adminCancelAdd()">ยกเลิก</button>
        <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminConfirmAddPlan()" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
      </div>
    </div>`;
  } else {
    html += `<button class="add-row-btn" onclick="adminStartAddPlan()">${ic.plus} เพิ่มแผนงานตรวจสอบ</button>`;
  }

  const sorted = [...PLANS].sort((a,b)=> sortableDateKey(a.PlannedDate).localeCompare(sortableDateKey(b.PlannedDate)));
  sorted.forEach(p=>{
    if(String(editId)===String(p.ID)){
      html += `<div class="admin-form">
        ${planFormFields()}
        <div class="frow">
          <button class="btn-sm" style="flex:1" onclick="adminCancelEdit()">ยกเลิก</button>
          <button class="btn-sm" style="flex:1;background:var(--navy);color:#fff;border-color:var(--navy)" onclick="adminSavePlanEdit('${p.ID}')" ${state.busy?'disabled':''}>${ic.check} บันทึก</button>
        </div>
      </div>`;
    } else {
      html += `<div class="admin-row">
        <div class="info">
          <div class="nm">${p.Area} • ${p.Type}</div>
          <div class="tg">${p.PlannedDate ? thaiDateDisplay(p.PlannedDate) : 'ไม่ระบุวันที่'} • ${p.Assignee||'ยังไม่ระบุผู้ตรวจ'} • ${p.Status||'รอดำเนินการ'}</div>
        </div>
        <div class="acts">
          <div class="icon-sm" onclick="adminStartEditPlan('${p.ID}')">${ic.pencil}</div>
          <div class="icon-sm danger" onclick="adminDeletePlan('${p.ID}')">${ic.trash}</div>
        </div>
      </div>`;
    }
  });
  return html;
}

async function adminConfirmAddPlan(){
  const vals = state.planFormDraft || {};
  if(!vals.Area || !vals.Type){ toastMsg("กรุณาเลือกพื้นที่และประเภทการตรวจ", ic.warn); return; }
  setBusy(true);
  try{
    const created = await apiPost("addPlan", vals, adminPassword);
    PLANS.push(created);
    state.adminAdding = false;
    state.planFormDraft = null;
    toastMsg("เพิ่มแผนงานเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminSavePlanEdit(id){
  const vals = state.planFormDraft || {};
  if(!vals.Area || !vals.Type){ toastMsg("กรุณาเลือกพื้นที่และประเภทการตรวจ", ic.warn); return; }
  setBusy(true);
  try{
    const updated = await apiPost("updatePlan", Object.assign({id}, vals), adminPassword);
    const item = PLANS.find(x=>String(x.ID)===String(id));
    if (item) Object.assign(item, updated);
    state.adminEditId = null;
    state.planFormDraft = null;
    toastMsg("บันทึกการแก้ไขเรียบร้อย");
  }catch(err){
    toastMsg("บันทึกไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

async function adminDeletePlan(id){
  if(!confirm("ยืนยันการลบแผนงานนี้หรือไม่?")) return;
  setBusy(true);
  try{
    await apiPost("deletePlan", { id }, adminPassword);
    PLANS = PLANS.filter(x=>String(x.ID)!==String(id));
    toastMsg("ลบแผนงานแล้ว");
  }catch(err){
    toastMsg("ลบไม่สำเร็จ: " + err.message, ic.warn);
  }
  setBusy(false);
}

/* ---------------- bottom nav ---------------- */
function renderBottomNav(){
  const openCount = tasks.filter(t=>t.Status!=="Closed").length;
  return `<div class="bottomnav">
    <button class="nav-btn ${state.view==='home'?'active':''}" onclick="nav('home')">${ic.home}<span>หน้าหลัก</span></button>
    <button class="nav-btn" onclick="nav('new')"><div class="fab">${ic.plus}</div></button>
    <button class="nav-btn ${state.view==='tasks'?'active':''}" onclick="nav('tasks')">
      ${ic.tasks}<span>งานของฉัน</span>
      ${openCount ? `<div class="dot">${openCount}</div>` : ""}
    </button>
  </div>`;
}

/* ---------------- boot ---------------- */
loadAllData();
</script>
</body>
</html>
